packages:
  - apps/*
  - packages/*
  - examples/*

allowBuilds:
  "@shopify/react-native-skia": true
  esbuild: true
  unrs-resolver: true

catalog:
  typescript: ^5.9.2
  vitest: ^3.2.4
  tsup: ^8.5.0
  zod: ^4.0.17

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.13"
  - "@expo/config-plugins@57.0.7"
  - babel-preset-expo@57.0.6
  - expo-asset@57.0.9
  - expo-file-system@57.0.2
  - expo-modules-core@57.0.10
  - expo-router@57.0.11
  - expo-symbols@57.0.2
  - expo@57.0.11

overrides:
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.2
  react-native-reanimated: 4.5.1
  react-native-worklets: 0.10.1
  react-native-gesture-handler: 2.32.0
  "@shopify/react-native-skia": 2.6.2
  expo-audio: 57.0.3
